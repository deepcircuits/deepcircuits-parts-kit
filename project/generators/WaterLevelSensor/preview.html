<!doctype html>
<html>
<head><meta charset="utf-8"><title>WaterLevelSensor — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.waterLevelSensor(), { pins: true, scale: 2, caption: "water level sensor" });
K.mount(root, K.waterLevelSensor({ indicators: { power: true } }), { scale: 2, caption: "powered" });
</script>
</body>
</html>
