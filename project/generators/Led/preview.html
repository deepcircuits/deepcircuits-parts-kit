<!-- @dsCard group="Parts" height=250 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Led — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.led({ color: "red" }), { pins: true, caption: "red, off" });
K.mount(root, K.led({ color: "red", on: true }), { caption: "red, on" });
K.mount(root, K.led({ color: "red", on: true, brightness: 0.35 }), { caption: "red, 35%" });
["green", "yellow", "blue", "white", "orange"].forEach(function (c) { K.mount(root, K.led({ color: c, on: true }), { caption: c + ", on" }); });
K.mount(root, K.led({ color: "red", on: true, live: { flow: true, probe: "C" } }), { caption: "live: flow, probe on C" });
</script>
</body>
</html>
