<!doctype html>
<html>
<head><meta charset="utf-8"><title>WaterPump — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.waterPump(), { pins: true, scale: 2, caption: "off" });
K.mount(root, K.waterPump({ running: true }), { scale: 2, caption: "running" });
</script>
</body>
</html>
