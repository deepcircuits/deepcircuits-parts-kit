<!doctype html>
<html>
<head><meta charset="utf-8"><title>CurrentSensor — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.acs712Module(), { pins: true, scale: 3, caption: "ACS712, 5 A" });
K.mount(root, K.acs712Module({ range: "30A", indicators: { power: true } }), { scale: 3, caption: "30 A, powered" });
</script>
</body>
</html>
