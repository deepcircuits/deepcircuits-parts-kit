<!doctype html>
<html>
<head><meta charset="utf-8"><title>RotaryDialer — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.rotaryDialer(), { pins: true, scale: 1.2, caption: "at rest" });
K.mount(root, K.rotaryDialer({ angle: 60 }), { scale: 1.2, caption: "turned 60°" });
</script>
</body>
</html>
