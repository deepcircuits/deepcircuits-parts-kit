<!doctype html>
<html>
<head><meta charset="utf-8"><title>RelayModule — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.relayModule(), { pins: true, scale: 1.2, caption: "powered" });
K.mount(root, K.relayModule({ indicators: { power: true, status: true } }), { scale: 1.2, caption: "energised" });
</script>
</body>
</html>
