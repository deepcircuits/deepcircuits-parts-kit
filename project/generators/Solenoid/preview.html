<!doctype html>
<html>
<head><meta charset="utf-8"><title>Solenoid — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.solenoid(), { pins: true, scale: 2, caption: "released" });
K.mount(root, K.solenoid({ position: 0.5 }), { scale: 2, caption: "half way" });
K.mount(root, K.solenoid({ position: 1 }), { scale: 2, caption: "pulled in" });
</script>
</body>
</html>
