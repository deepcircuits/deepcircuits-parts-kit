<!doctype html>
<html>
<head><meta charset="utf-8"><title>VoltageSensor — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");

</script>
</body>
</html>
