<!doctype html>
<html>
<head><meta charset="utf-8"><title>NeopixelMeter — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.neopixelMeter(), { pins: true, scale: 1.2, caption: "idle" });
K.mount(root, K.neopixelMeter({ level: 0.42, fps: 60, amps: 0.31 }), { scale: 1.2, caption: "reading" });
</script>
</body>
</html>
