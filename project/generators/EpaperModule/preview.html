<!doctype html>
<html>
<head><meta charset="utf-8"><title>EpaperModule — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.epaperModule(), { pins: true, scale: 1.4, caption: "blank" });
K.mount(root, K.epaperModule({ caption: "e-paper" }), { scale: 1.4, caption: "painted" });
</script>
</body>
</html>
