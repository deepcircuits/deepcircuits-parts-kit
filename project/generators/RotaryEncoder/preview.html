<!doctype html>
<html>
<head><meta charset="utf-8"><title>RotaryEncoder — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.rotaryEncoder(), { pins: true, caption: "at rest" });
K.mount(root, K.rotaryEncoder({ detent: 3 }), { caption: "three detents on" });
K.mount(root, K.rotaryEncoder({ pressed: true }), { caption: "pressed" });
</script>
</body>
</html>
