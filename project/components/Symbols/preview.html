<!-- @dsCard group="Primitives" height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Symbols — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.muxSymbol(), { pins: true, scale: 2, caption: "mux" });
K.mount(root, K.flipFlopSymbol(), { scale: 2, caption: "D" });
K.mount(root, K.flipFlopSymbol({ reset: true }), { scale: 2, caption: "D, reset" });
K.mount(root, K.flipFlopSymbol({ set: true, reset: true }), { scale: 2, caption: "D, set and reset" });
K.mount(root, K.clockGenerator(), { pins: true, scale: 2, caption: "clock" });
K.mount(root, K.supplySymbol({ voltage: 5 }), { pins: true, scale: 2, caption: "supply" });
K.mount(root, K.noteSymbol(), { scale: 2, caption: "note" });
</script>
</body>
</html>
