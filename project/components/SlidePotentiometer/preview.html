<!doctype html>
<html>
<head><meta charset="utf-8"><title>SlidePotentiometer — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.slidePotentiometer(), { pins: true, caption: "60 mm travel, at 0" });
K.mount(root, K.slidePotentiometer({ position: 0.6 }), { caption: "at 60%" });
K.mount(root, K.slidePotentiometer({ travel: 20, position: 1 }), { caption: "20 mm travel, at 100%" });
</script>
</body>
</html>
