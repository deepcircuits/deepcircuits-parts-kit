<!doctype html>
<html>
<head><meta charset="utf-8"><title>Neopixel — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.neopixel(), { pins: true, scale: 4, caption: "off" });
K.mount(root, K.neopixel({ r: 1 }), { scale: 4, caption: "red" });
K.mount(root, K.neopixel({ r: 0, g: 1, b: 0.4 }), { scale: 4, caption: "mint" });
K.mount(root, K.neopixel({ color: "#ffffff" }), { scale: 4, caption: "white" });
</script>
</body>
</html>
