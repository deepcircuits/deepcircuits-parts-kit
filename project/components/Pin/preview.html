<!-- @dsCard group="Primitives" height=170 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Pin — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
var T = K.tokens(), p = T.pitch;
function frag(w, h, finish, inner) { return { width: w, height: h, svg: K.svg(w, h, "pins", K.board({ width: w, height: h, finish: finish, holes: false }) + inner), pins: [] }; }
K.mount(root, frag(4 * p, 4 * p, "blue", K.pin({ x: 2 * p, y: 2.4 * p, kind: "pad", label: "SDA", side: "above" })), { caption: "pad, label above" });
K.mount(root, frag(4 * p, 4 * p, "purple", K.pin({ x: 2 * p, y: 1.6 * p, kind: "pad", label: "GND", side: "below" })), { caption: "pad, label below" });
K.mount(root, frag(4 * p, 4 * p, "teal", K.pin({ x: 1 * p, y: 2 * p, kind: "socket", label: "D13", side: "right" })), { caption: "socket, label right" });
K.mount(root, frag(4 * p, 4 * p, "white", K.pin({ x: 3 * p, y: 2 * p, kind: "pad", label: "A0", side: "left", silk: T["silk-dark"] })), { caption: "pad on white, label left" });
K.mount(root, frag(4 * p, 4 * p, "green", K.pin({ x: 2 * p, y: 2.2 * p, kind: "smd", label: "GP0", side: "above" })), { caption: "SMD pad" });
</script>
</body>
</html>
