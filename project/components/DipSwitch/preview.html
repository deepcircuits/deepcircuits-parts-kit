<!doctype html>
<html>
<head><meta charset="utf-8"><title>DipSwitch — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.dipSwitch(), { pins: true, caption: "8 positions, all off" });
K.mount(root, K.dipSwitch({ values: [1, 0, 1, 1, 0, 0, 1, 0] }), { caption: "10110010" });
K.mount(root, K.dipSwitch({ count: 4, values: [1, 1, 0, 1] }), { caption: "4 positions" });
</script>
</body>
</html>
