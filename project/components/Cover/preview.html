<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DeepCircuits Parts Kit</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--canvas, #ffffff); color: var(--canvas-ink, #020817); font-family: var(--font-sans, ui-sans-serif, system-ui, sans-serif); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .band { position: absolute; top: 0; left: 0; width: 960px; height: 115.2px; overflow: hidden; }
  .band svg { display: block; width: 960px; height: 115.2px; }
  .blue { fill: var(--pcb-blue, #1f5d87); }
  .gold { fill: var(--pad, #d4b25c); }
  .ink { fill: var(--chip, #1f2328); }
  .live { fill: var(--signal, #ffd60a); }
  .teal { fill: var(--pcb-teal, #137d8e); }
  .hole { fill: var(--hole, #0b1420); }
  .blk { rx: var(--radius-board, 3px); }
  .words { position: absolute; left: 28.8px; bottom: 28.8px; max-width: 900px; }
  .name { margin: 0; font-size: 64px; line-height: .95; font-weight: 700; letter-spacing: -0.02em; color: var(--canvas-ink, #020817); white-space: nowrap; }
  .tag { margin: 9.6px 0 0 2px; font-size: 14px; line-height: 20px; color: var(--canvas-ink-muted, #64748b); }
</style>
</head>
<body>
<div class="cover">
<div class="band" aria-hidden="true">
<svg viewBox="0 0 960 115.2" width="960" height="115.2">
<!--
  blocks      pcb-blue 288×115.2 (30×12 pitches, the module finish, the largest) · pad 96×96 (10 pitches, the gold every part shares) · chip 268.8×96 (28×10 pitches, the ink of every IC) · signal 48×48 (5 pitches; the live colour stays small, it only ever means "happening now") · pcb-teal 182.4×115.2 bleeding off the right edge (the board people recognise)
  arrangement a strip of unequal bands across the top, the top-band skeleton (the name is 22 characters), gutters pitch-2 (19.2), the blue and teal blocks full band height, the others hung from the top
  pattern     a perfboard: gold pads with dark holes on the pcb-blue block, from "every pin sits a whole number of pitches from its first pin" (precise, technical, mono, a grid → a dot grid at one spacing step); 27 units
  scales      sides in pitch multiples (288 = 30 pitches, 96 = 10, 48 = 5); gutters pitch-2; dot pitch pitch-3 (28.8); dot radius pitch-half (4.8), hole hole-radius ×2 (2.6); corners radius-board
-->
<rect class="blue blk" x="0" y="-8" width="288" height="123.2" rx="3"/>
<g class="gold">
<circle cx="28.8" cy="28.8" r="4.8"/><circle cx="57.6" cy="28.8" r="4.8"/><circle cx="86.4" cy="28.8" r="4.8"/><circle cx="115.2" cy="28.8" r="4.8"/><circle cx="144" cy="28.8" r="4.8"/><circle cx="172.8" cy="28.8" r="4.8"/><circle cx="201.6" cy="28.8" r="4.8"/><circle cx="230.4" cy="28.8" r="4.8"/><circle cx="259.2" cy="28.8" r="4.8"/>
<circle cx="28.8" cy="57.6" r="4.8"/><circle cx="57.6" cy="57.6" r="4.8"/><circle cx="86.4" cy="57.6" r="4.8"/><circle cx="115.2" cy="57.6" r="4.8"/><circle cx="144" cy="57.6" r="4.8"/><circle cx="172.8" cy="57.6" r="4.8"/><circle cx="201.6" cy="57.6" r="4.8"/><circle cx="230.4" cy="57.6" r="4.8"/><circle cx="259.2" cy="57.6" r="4.8"/>
<circle cx="28.8" cy="86.4" r="4.8"/><circle cx="57.6" cy="86.4" r="4.8"/><circle cx="86.4" cy="86.4" r="4.8"/><circle cx="115.2" cy="86.4" r="4.8"/><circle cx="144" cy="86.4" r="4.8"/><circle cx="172.8" cy="86.4" r="4.8"/><circle cx="201.6" cy="86.4" r="4.8"/><circle cx="230.4" cy="86.4" r="4.8"/><circle cx="259.2" cy="86.4" r="4.8"/>
</g>
<g class="hole">
<circle cx="28.8" cy="28.8" r="2.6"/><circle cx="57.6" cy="28.8" r="2.6"/><circle cx="86.4" cy="28.8" r="2.6"/><circle cx="115.2" cy="28.8" r="2.6"/><circle cx="144" cy="28.8" r="2.6"/><circle cx="172.8" cy="28.8" r="2.6"/><circle cx="201.6" cy="28.8" r="2.6"/><circle cx="230.4" cy="28.8" r="2.6"/><circle cx="259.2" cy="28.8" r="2.6"/>
<circle cx="28.8" cy="57.6" r="2.6"/><circle cx="57.6" cy="57.6" r="2.6"/><circle cx="86.4" cy="57.6" r="2.6"/><circle cx="115.2" cy="57.6" r="2.6"/><circle cx="144" cy="57.6" r="2.6"/><circle cx="172.8" cy="57.6" r="2.6"/><circle cx="201.6" cy="57.6" r="2.6"/><circle cx="230.4" cy="57.6" r="2.6"/><circle cx="259.2" cy="57.6" r="2.6"/>
<circle cx="28.8" cy="86.4" r="2.6"/><circle cx="57.6" cy="86.4" r="2.6"/><circle cx="86.4" cy="86.4" r="2.6"/><circle cx="115.2" cy="86.4" r="2.6"/><circle cx="144" cy="86.4" r="2.6"/><circle cx="172.8" cy="86.4" r="2.6"/><circle cx="201.6" cy="86.4" r="2.6"/><circle cx="230.4" cy="86.4" r="2.6"/><circle cx="259.2" cy="86.4" r="2.6"/>
</g>
<rect class="gold blk" x="307.2" y="-8" width="96" height="104" rx="3"/>
<rect class="ink blk" x="422.4" y="-8" width="268.8" height="104" rx="3"/>
<rect class="live blk" x="710.4" y="-8" width="48" height="56" rx="3"/>
<rect class="teal blk" x="777.6" y="-8" width="200" height="123.2" rx="3"/>
</svg>
</div>
<div class="words">
<h1 class="name">DeepCircuits Parts Kit</h1>
<p class="tag">Real parts, drawn to the 0.1-inch grid.</p>
</div>
</div>
</body>
</html>
