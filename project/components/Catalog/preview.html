<!-- @dsCard group="Parts" height=420 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Catalog — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.unoClassBoard({ indicators: { power: true, user: true } }), { scale: 1, caption: "unoClassBoard, powered" });
K.mount(root, K.esp32S3DevKit(), { scale: 1, caption: "esp32S3DevKit" });
K.mount(root, K.picoClassBoard({ indicators: { power: true } }), { scale: 1, caption: "picoClassBoard" });
K.mount(root, K.lightSensor({ indicators: { power: true, out: true } }), { scale: 1, caption: "lightSensor, both lamps lit" });
K.mount(root, K.ultrasonicRanger(), { scale: 1, caption: "ultrasonicSensor" });
K.mount(root, K.ne555Timer(), { pins: true, caption: "ne555Timer" });
K.mount(root, K.ssd1306Module({ caption: "Hello" }), { caption: "ssd1306Module with a caption" });
</script>
</body>
</html>
