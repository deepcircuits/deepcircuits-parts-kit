<!doctype html>
<html>
<head><meta charset="utf-8"><title>Servo — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.servo(), { pins: true, scale: 1, caption: "centre" });
K.mount(root, K.servo({ angle: 60 }), { scale: 1, caption: "60°" });
K.mount(root, K.servo({ angle: -90 }), { scale: 1, caption: "-90°" });
</script>
</body>
</html>
