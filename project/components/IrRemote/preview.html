<!doctype html>
<html>
<head><meta charset="utf-8"><title>IrRemote — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.irRemote(), { scale: 1.4, caption: "at rest" });
K.mount(root, K.irRemote({ pressed: "play" }), { scale: 1.4, caption: "play pressed" });
</script>
</body>
</html>
