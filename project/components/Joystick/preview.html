<!doctype html>
<html>
<head><meta charset="utf-8"><title>Joystick — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.joystick(), { pins: true, caption: "centred" });
K.mount(root, K.joystick({ x: 0.8, y: 0.5 }), { caption: "pushed up and right" });
K.mount(root, K.joystick({ pressed: true }), { caption: "pressed" });
</script>
</body>
</html>
