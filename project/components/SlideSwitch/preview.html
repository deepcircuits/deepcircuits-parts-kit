<!doctype html>
<html>
<head><meta charset="utf-8"><title>SlideSwitch — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.slideSwitch({ contact: 1 }), { pins: true, caption: "contact 1" });
K.mount(root, K.slideSwitch({ contact: 3 }), { caption: "contact 3" });
</script>
</body>
</html>
