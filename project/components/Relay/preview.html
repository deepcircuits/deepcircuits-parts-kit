<!doctype html>
<html>
<head><meta charset="utf-8"><title>Relay — preview</title></head>
<body>
<div id="root" class="pk-row"></div>
<script>
var K = window.PartsKit, root = document.getElementById("root");
K.setTokenMode("live");
K.mount(root, K.relay(), { pins: true, scale: 2.2, caption: "released" });
K.mount(root, K.relay({ energised: true }), { scale: 2.2, caption: "energised" });
</script>
</body>
</html>
